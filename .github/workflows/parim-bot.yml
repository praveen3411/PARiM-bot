name: PARiM Auto-Apply Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  apply-shifts:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore applied shifts cache
        uses: actions/cache@v4
        with:
          path: applied_shifts.json
          key: parim-applied-shifts
          restore-keys: parim-applied-shifts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run PARiM bot
        env:
          PARIM_EMAIL: ${{ secrets.PARIM_EMAIL }}
          PARIM_PASSWORD: ${{ secrets.PARIM_PASSWORD }}
          PARIM_URL: ${{ secrets.PARIM_URL }}
        run: python parim_bot.py

      - name: Save applied shifts cache
        if: always()
        uses: actions/cache@v4
        with:
          path: applied_shifts.json
          key: parim-applied-shifts
